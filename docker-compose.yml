version: '3.8'

services:
  # Database
  postgres:
    image: ankane/pgvector:latest # PostgreSQL with pgvector for RAG
    environment:
      POSTGRES_USER: evalos
      POSTGRES_PASSWORD: evalos_password
      POSTGRES_DB: evalos_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalos -d evalos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Async Queue & Cache
  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Object Storage (S3 API compatible)
  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: evalos_admin
      MINIO_ROOT_PASSWORD: evalos_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://evalos:evalos_password@postgres:5432/evalos_db
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=evalos_admin
      - S3_SECRET_KEY=evalos_password
      - S3_BUCKET=evalos-documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # Celery Worker for async PDF processing / OCR / ML
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A core.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://evalos:evalos_password@postgres:5432/evalos_db
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=evalos_admin
      - S3_SECRET_KEY=evalos_password
      - S3_BUCKET=evalos-documents
    depends_on:
      - redis
      - postgres
      - minio
    volumes:
      - ./backend:/app

  # Vite Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Baked into the static bundle at build time (see Dockerfile.frontend).
        # For local docker-compose, localhost:8000 is correct because the
        # browser (not the frontend container) calls the backend directly.
        # For a real deployment, override with the backend's public URL, e.g.:
        #   docker compose build --build-arg VITE_API_URL=https://your-backend.example.com/api/v1 frontend
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
